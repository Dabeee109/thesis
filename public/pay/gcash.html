<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Xendit Payment Gateway - GCash</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 30px 16px;
      background-color: #f0f4f9;
      color: #333;
    }
    .container {
      max-width: 420px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 125, 254, 0.12);
      overflow: hidden;
      text-align: center;
    }
    .header {
      background: linear-gradient(135deg, #153f74 0%, #007dfe 100%);
      padding: 24px 20px;
      color: #ffffff;
    }
    .header h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 800;
    }
    .header p {
      margin: 6px 0 0;
      font-size: 13px;
      opacity: 0.9;
    }
    .card-body {
      padding: 28px 20px;
    }
    .channel-box {
      background: #eef6ff;
      border: 1px solid #c7e1ff;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 24px;
    }
    .channel-title {
      font-size: 12px;
      font-weight: bold;
      color: #007dfe;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .channel-val {
      font-size: 20px;
      font-weight: 800;
      color: #153f74;
      margin-top: 4px;
    }
    .btn-xendit {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 14px 20px;
      background: linear-gradient(135deg, #007dfe 0%, #0056b3 100%);
      color: #ffffff;
      text-decoration: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      box-shadow: 0 4px 14px rgba(0, 125, 254, 0.3);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div style="font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:1px; opacity:0.85; margin-bottom:4px;">Secure Checkout Powered by</div>
      <h1>xendit | GCash</h1>
      <p>Diner's Cafe • Official Payment Gateway</p>
    </div>
    <div class="card-body">
      <div class="channel-box">
        <div class="channel-title">Payment Channel</div>
        <div class="channel-val">GCash via Xendit</div>
        <div style="font-size:13px; color:#555; margin-top:6px;">Ligtas at opisyal na payment checkout para sa inyong order.</div>
      </div>
      <a href="/pay/gcash" class="btn-xendit" id="gcashAppBtn">
        💳 Magbayad sa Xendit (GCash)
      </a>
      <p style="font-size:12px; color:#888; margin-top:20px;">
        Protected by 256-bit SSL Encryption • Xendit Payment Gateway
      </p>
    </div>
  </div>
</body>
</html>
