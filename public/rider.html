<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/assets/app-icon.svg" type="image/svg+xml">

  <!-- Immediate Strict Frontend Auth Guard (Requirement 4) -->
  <script>
    (function () {
      function getAuthToken() {
        return localStorage.getItem('diners_token') || sessionStorage.getItem('diners_token');
      }
      function getAuthUser() {
        try {
          return JSON.parse(localStorage.getItem('diners_user') || sessionStorage.getItem('diners_user') || 'null');
        } catch (e) {
          return null;
        }
      }
      function isTokenValid(token) {
        if (!token || typeof token !== 'string') return false;
        try {
          const parts = token.split('.');
          if (parts.length !== 3) return false;
          const payload = JSON.parse(atob(parts[1]));
          if (payload.exp && Date.now() >= payload.exp * 1000) {
            return false;
          }
          return true;
        } catch (e) {
          return false;
        }
      }

      const token = getAuthToken();
      const user = getAuthUser();

      if (!token || !user || !isTokenValid(token)) {
        localStorage.removeItem('diners_token');
        localStorage.removeItem('diners_user');
        sessionStorage.removeItem('diners_token');
        sessionStorage.removeItem('diners_user');
        window.location.replace('/login.html?redirect=' + encodeURIComponent(window.location.pathname));
      }
    })();
  </script>
  <style>

<body>

  <div class="rider-container">
    <!-- 1. Ultra-Compact Top Rider Profile Header -->
    <header class="rider-header">
      <div class="rider-profile-bar" onclick="setRiderView('profile')" style="cursor: pointer;" title="View Rider Profile">

          <h2 style="font-size: 1.06rem; font-weight: 800; margin: 0; line-height: 1.2; color: #fbf6f0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" id="rider-name-display">Marco Santos</h2>
          <span style="font-size: 0.76rem; color: #c89f74; font-weight: 600; display: block; margin-top: 2px; opacity: 0.92;" id="rider-vehicle-display">MC-7890-PH</span>

        </span>
        <!-- Compact Logout Icon Button -->
        <button class="btn-logout-icon" id="btn-logout-rider" onclick="logoutRider()" title="Sign out of Rider Portal" aria-label="Sign out of Rider Portal">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- 2. Consolidated Nano-Status Row -->
    <div class="nano-status-row">
      <div class="nano-status-left">
        <div class="audio-hint-pill" id="audio-unlock-pill" onclick="unlockAudio()" title="Click to test & enable audio chimes">
          <span>🔔 Alerts Active</span>
        </div>
        <span class="nano-divider"></span>
        <span style="font-size: 0.75rem; color: #b5a395; font-weight: 600; white-space: nowrap;" id="live-indicator">⚡ Live Sync</span>
      </div>
      <button type="button" class="nano-refresh-btn" id="btn-refresh-rider" onclick="loadRiderDeliveries()" title="Refresh Deliveries" aria-label="Refresh Deliveries">
        <span style="font-size: 0.95rem; line-height: 1;">🔄</span>
      </button>
    </div>

    <!-- 3. Top Horizontal Tabs for Active Views -->
    <nav class="rider-tabs-bar" role="tablist" aria-label="Rider Portal Views">
      <button id="tab-active" type="button" class="rider-tab-btn active" role="tab" aria-selected="true" onclick="setRiderView('active')">
        <span>🚴 Active Queue</span>
      </button>
      <button id="tab-history" type="button" class="rider-tab-btn" role="tab" aria-selected="false" onclick="setRiderView('history')">
        <span>📜 History</span>
      </button>
      <button id="tab-profile" type="button" class="rider-tab-btn compact-tab" role="tab" aria-selected="false" onclick="setRiderView('profile')" title="My Profile">
        <span>👤 Profile</span>
      </button>
    </nav>

    <!-- Main Dynamic Feed Container -->
    <main id="rider-trips-container" class="rider-feed-main">
      <!-- Populated via loadRiderDeliveries() or showProfile() -->
    </main>
  </div>

  <script src="js/api.js"></script>
  <script>
    let currentRiderView = 'active';
    let audioContext = null;
    let audioUnlocked = false;
    let currentUser = null;

    // -------------------------------------------------------------
    // 1. Audio & Notification Engine (Web Audio API Synthesizer)
    // -------------------------------------------------------------
    function getAudioContext() {
      if (!audioContext) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) {
          audioContext = new AudioCtx();
        }
      }
      if (audioContext && audioContext.state === 'suspended') {
        audioContext.resume();
      }
      return audioContext;
    }

    function unlockAudio() {
      const ctx = getAudioContext();
      audioUnlocked = true;
      playRiderChime('preparing');
      const pill = document.getElementById('audio-unlock-pill');
      if (pill) {
        pill.innerHTML = '<span>🔔 Alerts Active</span>';
        pill.style.color = 'var(--status-success)';
      }
      // Request browser notification permission if available
      if ('Notification' in window && Notification.permission === 'default') {
        Notification.requestPermission();
      }
    }

    /**
     * Synthesize clean, zero-latency Web Audio chime tones
     * - 'preparing': Two-tone pleasant chime (Kitchen Preparation alert)
     * - 'dispatched': High-priority actionable fanfare (Ready for Dispatch alert)
     */
    function playRiderChime(type) {
      try {
        const ctx = getAudioContext();
        if (!ctx) return;
        const now = ctx.currentTime;

        if (type === 'preparing') {
          // Two-tone rising chime (D5: 587.33Hz -> A5: 880Hz)
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(587.33, now);
          osc.frequency.exponentialRampToValueAtTime(880.00, now + 0.22);
          gain.gain.setValueAtTime(0.28, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.45);
        } else {
          // Actionable 4-tone dispatch fanfare (C5: 523.25Hz -> E5: 659.25Hz -> G5: 783.99Hz -> C6: 1046.50Hz)
          const notes = [523.25, 659.25, 783.99, 1046.50];
          notes.forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            const noteStart = now + (idx * 0.11);
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, noteStart);
            gain.gain.setValueAtTime(0.32, noteStart);
            gain.gain.exponentialRampToValueAtTime(0.001, noteStart + 0.24);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(noteStart);
            osc.stop(noteStart + 0.24);
          });
        }
      } catch (err) {
        console.warn('[Web Audio] Could not play synthesized chime:', err);
      }
    }

    function triggerBrowserPush(title, message) {
      if ('Notification' in window && Notification.permission === 'granted') {
        try {
          new Notification(title, {
            body: message,
            icon: '/favicon.ico',
            badge: '/favicon.ico'
          });
        } catch (e) {}
      }
    }

    // -------------------------------------------------------------
    // 2. Lifecycle & Real-Time SSE Dispatch Listener
    // -------------------------------------------------------------
    document.addEventListener('DOMContentLoaded', () => {
      // Auto unlock audio on any first user tap or click
      document.body.addEventListener('click', () => {
        if (!audioUnlocked) unlockAudio();
      }, { once: true });

      initRiderProfile();
      loadRiderDeliveries();

      // Connect to SSE real-time events
      API.connectSSE((eventType, data) => {
        handleRealtimeEvent(eventType, data);
      });
    });

    function initRiderProfile() {
      currentUser = API.getUser();
      if (currentUser) {
        const rawName = (currentUser.name || currentUser.full_name || 'Marco Santos').replace(/\s*\([^)]*\)\s*$/, '').trim();
        document.getElementById('rider-name-display').innerText = rawName || 'Marco Santos';
        const plate = currentUser.vehicle_plate_no || currentUser.vehiclePlate || 'MC-7890-PH';
        document.getElementById('rider-vehicle-display').innerText = plate;
      }
    }

    function handleRealtimeEvent(eventType, data) {
      if (!data) return;

      const orderNumber = data.orderNumber || data.order_number || data.orderId || '';
      const newStatus = (data.newStatus || data.status || '').toLowerCase();
      const currentRiderId = currentUser ? (currentUser.riderId || currentUser.id) : null;

      // Filter: if targeted to a specific rider, only trigger for that rider
      if (data.riderId && currentRiderId && String(data.riderId) !== String(currentRiderId)) {
        return;
      }

      // Requirement 1.1: Transition to 'IN_PREPARATION' (In Kitchen Preparation)
      if (newStatus === 'preparing' || newStatus === 'in_preparation' || newStatus === 'in kitchen preparation') {
        const msg = data.alertMessage || `🍳 Order #${orderNumber} is now being prepared in the kitchen. Stand by for pickup.`;
        playRiderChime('preparing');
        API.toast(msg, 'warning');
        triggerBrowserPush('🍳 Kitchen Prep Alert', msg);
        loadRiderDeliveries();
      }
      // Requirement 1.2: Transition to 'DISPATCHED' / 'ON_DELIVERY'
      else if (newStatus === 'dispatched' || newStatus === 'on_delivery' || newStatus === 'dispatched / on delivery') {
        const msg = data.alertMessage || `🚀 Order #${orderNumber} is ready for dispatch! Please pick up the package and proceed to customer.`;
        playRiderChime('dispatched');
        API.toast(msg, 'success');
        triggerBrowserPush('🚀 Order Ready for Dispatch!', msg);
        loadRiderDeliveries();
      }
      // General queue updates
      else if (eventType === 'DELIVERY_ASSIGNED' || eventType === 'ORDER_STATUS_CHANGED') {
        loadRiderDeliveries();
      }
    }

    // -------------------------------------------------------------
    // 3. Tab Navigation & View Management
    // -------------------------------------------------------------
    function setRiderView(view) {
      currentRiderView = view;
      const tabActive = document.getElementById('tab-active');
      const tabHistory = document.getElementById('tab-history');
      const tabProfile = document.getElementById('tab-profile');

      if (tabActive) {
        tabActive.className = view === 'active' ? 'rider-tab-btn active' : 'rider-tab-btn';
        tabActive.setAttribute('aria-selected', view === 'active' ? 'true' : 'false');
      }
      if (tabHistory) {
        tabHistory.className = view === 'history' ? 'rider-tab-btn active' : 'rider-tab-btn';
        tabHistory.setAttribute('aria-selected', view === 'history' ? 'true' : 'false');
      }
      if (tabProfile) {
        tabProfile.className = view === 'profile' ? 'rider-tab-btn compact-tab active' : 'rider-tab-btn compact-tab';
        tabProfile.setAttribute('aria-selected', view === 'profile' ? 'true' : 'false');
      }

      if (view === 'profile') {
        renderProfileView();
      } else {
        loadRiderDeliveries();
      }
    }

    // -------------------------------------------------------------
    // 4. Data Loading & Dynamic Task Card Rendering
    // -------------------------------------------------------------
    async function loadRiderDeliveries() {
      if (currentRiderView === 'profile') return;

      try {
        const endpoint = currentRiderView === 'active' ? '/rider/orders/active' : '/rider/history';
        const res = await API.get(endpoint);
        const container = document.getElementById('rider-trips-container');
        container.innerHTML = '';

        const trips = res.orders || res.history || res.deliveries || [];

        if (trips.length === 0) {
          if (currentRiderView === 'active') {
            container.innerHTML = `
              <div class="empty-state-canvas py-16 py-20">
                <div class="empty-state-glow-icon" aria-hidden="true">
                  <svg width="92" height="76" viewBox="0 0 92 76" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                      <linearGradient id="scooterGlowGrad" x1="10" y1="12" x2="82" y2="66" gradientUnits="userSpaceOnUse">
                        <stop offset="0%" stop-color="#f7d6b5"/>
                        <stop offset="55%" stop-color="#e2a872"/>
                        <stop offset="100%" stop-color="#c97b53"/>
                      </linearGradient>
                    </defs>
                    <!-- Delivery Thermal Box -->
                    <rect x="14" y="16" width="22" height="19" rx="4" stroke="url(#scooterGlowGrad)" stroke-width="3.2" fill="rgba(212, 163, 115, 0.14)"/>
                    <line x1="18" y1="24" x2="32" y2="24" stroke="#f7d6b5" stroke-width="2.2" stroke-linecap="round"/>
                    <!-- Scooter Body & Handlebar -->
                    <path d="M18 39H46L56 23H49" stroke="url(#scooterGlowGrad)" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M55 23L65 48H43L35 39H18C15.5 39 14 41 14 43.5V48H22" stroke="url(#scooterGlowGrad)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" fill="rgba(212, 163, 115, 0.12)"/>
                    <!-- Front Fender & Headlight -->
                    <path d="M61 36H70C73 36 75 38.5 75 41.5V44H63" stroke="url(#scooterGlowGrad)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
                    <circle cx="62" cy="24" r="3" fill="#faedcd"/>
                    <!-- Rear & Front Wheels -->
                    <circle cx="26" cy="54" r="10.5" stroke="url(#scooterGlowGrad)" stroke-width="3.8" fill="#17100b"/>
                    <circle cx="26" cy="54" r="4" fill="#e2a872"/>
                    <circle cx="66" cy="54" r="10.5" stroke="url(#scooterGlowGrad)" stroke-width="3.8" fill="#17100b"/>
                    <circle cx="66" cy="54" r="4" fill="#e2a872"/>
                  </svg>
                </div>
                <h3 class="empty-state-title">Walang aktibong delivery sa iyong queue ngayon.</h3>
                <p class="empty-state-subtitle">Awtomatikong lalabas dito kapag may bagong order na na-assign sa iyo.</p>
              </div>
            `;
          } else {
            container.innerHTML = `
              <div class="empty-state-canvas py-16 py-20">
                <div class="empty-state-glow-icon">📜</div>
                <h3 class="empty-state-title">Wala pang natapos na delivery history.</h3>
                <p class="empty-state-subtitle">Makikita rito ang lahat ng iyong nakumpletong deliveries.</p>
              </div>
            `;
          }
          return;
        }

        trips.forEach(del => {
          const rawStatus = (del.raw_status || del.order_status || del.status || '').toLowerCase();
          const isDelivered = rawStatus === 'delivered';
          const isKitchen = rawStatus === 'preparing' || rawStatus === 'in kitchen preparation';
          const isDispatched = rawStatus === 'dispatched' || rawStatus === 'dispatched / on delivery';

          // Requirement 3: Build Google Maps Navigation URL
          // If customer_lat and customer_lng exist, navigate by coordinates. Otherwise, use plaintext delivery_address.
          let mapsUrl = '';
          if (del.customer_lat && del.customer_lng) {
            mapsUrl = `https://www.google.com/maps/dir/?api=1&destination=${del.customer_lat},${del.customer_lng}`;
          } else {
            mapsUrl = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(del.delivery_address || 'Metro Manila')}`;
          }

          const card = document.createElement('div');
          card.className = `trip-card ${isDispatched ? 'dispatched' : isKitchen ? 'preparing' : isDelivered ? 'delivered' : ''}`;
          card.innerHTML = `
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
              <span style="font-weight: 800; font-size: 1.15rem; color: var(--brand-primary);">#${del.order_number}</span>
              <span class="badge badge-${rawStatus.replace(/[^a-z]/g, '')}">
                ${del.order_status || del.status}
              </span>
            </div>

            <div style="font-weight: 700; font-size: 1.02rem; margin-bottom: 4px; display: flex; align-items: center; gap: 6px;">
              👤 <span>${del.customer_name || 'Customer'}</span>
            </div>

            <div style="font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 6px; line-height: 1.35;">
              📍 <strong>Drop-off:</strong> ${del.delivery_address || 'Store vicinity'}
            </div>

            <div style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 10px; display: flex; gap: 14px; flex-wrap: wrap;">
              <span>📏 Distance: <strong>${parseFloat(del.distance_km || 1).toFixed(1)} km</strong></span>
              <span>🛵 Fare: <strong style="color: var(--brand-gold);">₱${parseFloat(del.final_fare || 0).toFixed(2)}</strong></span>
            </div>

            ${del.customer_notes ? `
              <div style="font-size: 0.82rem; padding: 6px 10px; background: var(--bg-surface-elevated); border-radius: 6px; color: var(--brand-crema); margin-bottom: 10px; border-left: 2px solid var(--brand-primary);">
                📝 <em>"${del.customer_notes}"</em>
              </div>
            ` : ''}

            ${!isDelivered ? `
              <div class="action-row">
                <!-- Action Row Grid: Navigation & Calling -->
                <div class="action-grid">
                  <a href="${mapsUrl}" target="_blank" rel="noopener noreferrer" class="btn-nav-maps" title="Open GPS directions in Google Maps">
                    🗺️ Open Navigation
                  </a>
                  <a href="tel:${del.customer_phone || ''}" class="btn-call" title="Call Customer">
                    📞 Call Customer
                  </a>
                </div>

                <!-- Primary Delivery Action -->
                ${isKitchen ? `
                  <button class="btn btn-secondary btn-complete" disabled style="opacity: 0.6; cursor: not-allowed; background: var(--bg-surface-elevated);" title="Order is currently in kitchen preparation. Stand by for dispatch.">
                    ⏳ In Kitchen Prep &bull; Stand by for Pickup
                  </button>
                ` : `
                  <button class="btn btn-success btn-complete" onclick="markDelivered(${del.order_id})" title="Mark order as delivered">
                    ✅ Complete Delivery
                  </button>
                `}
              </div>
            ` : `
              <div style="margin-top: 8px; font-size: 0.84rem; color: var(--status-success); font-weight: 600; display: flex; align-items: center; gap: 6px;">
                🎉 Delivery Completed &bull; Customer feedback unlocked
              </div>
            `}
          `;
          container.appendChild(card);
        });
      } catch (err) {
        console.error('Rider trips load error:', err);
      }
    }

    // -------------------------------------------------------------
    // 5. Delivery Completion Gatekeeper
    // -------------------------------------------------------------
    async function markDelivered(orderId) {
      try {
        const res = await API.post(`/rider/orders/${orderId}/complete`, {});
        if (res && res.success) {
          playRiderChime('preparing');
          API.toast('🎉 Delivery marked completed! Customer prompt unlocked.', 'success');
          loadRiderDeliveries();
        } else {
          API.toast(res.message || 'Cannot complete delivery.', 'warning');
        }
      } catch (err) {
        console.error('Mark delivered error:', err);
        API.toast(err.message || 'Cannot complete delivery.', 'error');
      }
    }

    // -------------------------------------------------------------
    // 6. Rider Profile View (Role-isolated, no admin analytics)
    // -------------------------------------------------------------
    function renderProfileView() {
      const container = document.getElementById('rider-trips-container');
      const u = API.getUser() || {};

      container.innerHTML = `
        <div class="profile-card">
          <div style="text-align: center; margin-bottom: 18px;">
            <div style="width: 64px; height: 64px; border-radius: 50%; background: rgba(212, 163, 115, 0.15); border: 2px solid var(--brand-primary); display: inline-flex; align-items: center; justify-content: center; font-size: 2rem; margin-bottom: 8px;">
              🛵
            </div>
            <h3 style="margin: 0; font-size: 1.2rem;">${u.name || u.full_name || 'Marco Santos'}</h3>
            <span style="font-size: 0.8rem; color: var(--brand-primary); font-weight: 600;">ACTIVE COURIER</span>
          </div>

          <div class="profile-row">
            <span style="color: var(--text-muted);">Assigned Vehicle:</span>
            <strong>${(u.vehicle_type || 'Motorcycle').toUpperCase()}</strong>
          </div>
          <div class="profile-row">
            <span style="color: var(--text-muted);">Plate Number:</span>
            <strong>${u.vehicle_plate_no || 'MC-7890-PH'}</strong>
          </div>
          <div class="profile-row">
            <span style="color: var(--text-muted);">Contact Phone:</span>
            <strong>${u.phone_number || '0917-555-0199'}</strong>
          </div>
          <div class="profile-row">
            <span style="color: var(--text-muted);">Current Status:</span>
            <span class="rider-badge">🟢 Online &bull; Available</span>
          </div>
          <div class="profile-row">
            <span style="color: var(--text-muted);">Portal Access:</span>
            <strong style="color: var(--brand-crema);">Courier Dispatch Only</strong>
          </div>

          <div style="margin-top: 24px; display: flex; flex-direction: column; gap: 10px;">
            <button class="btn btn-secondary btn-block" onclick="unlockAudio()">
              🔔 Test Audio Chime & Notifications
            </button>
            <button class="btn btn-outline btn-block" onclick="logoutRider()" style="color: #ff7b7b; border-color: rgba(239, 68, 68, 0.4);">
              🚪 Sign Out of Rider Account
            </button>
          </div>
        </div>
      `;
    }

    function logoutRider() {
      if (confirm('Are you sure you want to log out of the Rider Portal?')) {
        API.logout();
      }
    }
  </script>
  <!-- Smart App Installation Floating Banner -->
  <script src="/js/app-install-banner.js"></script>
  <!-- Role-Based Orientation Lock -->
  <script src="/js/orientation-lock.js?v=20261109_02"></script>
</body>
</html>
