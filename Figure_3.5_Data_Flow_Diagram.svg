    <rect width="230" height="42" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <path d="M 0 4 C 0 1.79 1.79 0 4 0 L 36 0 L 36 42 L 4 42 C 1.79 42 0 40.21 0 38 Z" fill="#2B6CB0"/>
    <text x="18" y="26" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">D5</text>
    <text x="133" y="26" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">Orders &amp; Order Details</text>
  </g>

  <!-- D6: Deliveries -->
  <g transform="translate(750, 690)" filter="url(#cardShadow)">
    <rect width="180" height="42" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <path d="M 0 4 C 0 1.79 1.79 0 4 0 L 36 0 L 36 42 L 4 42 C 1.79 42 0 40.21 0 38 Z" fill="#2B6CB0"/>
    <text x="18" y="26" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">D6</text>
    <text x="108" y="26" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">Deliveries</text>
