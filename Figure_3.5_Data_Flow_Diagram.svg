<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 860" width="100%" height="100%" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;">
  <defs>
    <!-- Soft Modern Card Shadow matching dbdiagram -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.08"/>
    </filter>

    <!-- Arrow Marker in matching dbdiagram Blue -->
    <marker id="dfdArrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2B6CB0" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="640" y="38" text-anchor="middle" font-size="20" font-weight="800" fill="#0f172a" letter-spacing="-0.5">Figure 3.5: System Data Flow Diagram (DFD Level 1)</text>

  <!-- ==================== EXTERNAL ENTITIES ==================== -->
  
  <!-- 1. Customer -->
  <g transform="translate(60, 240)">
    <g filter="url(#cardShadow)">
      <rect width="170" height="96" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
      <path d="M 0 6 C 0 2.68 2.68 0 6 0 L 164 0 C 167.32 0 170 2.68 170 6 L 170 28 L 0 28 Z" fill="#2B6CB0"/>
      <text x="85" y="19" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff" letter-spacing="0.5">CUSTOMER</text>
      <text x="85" y="54" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e293b">Customer Client</text>
      <text x="85" y="74" text-anchor="middle" font-size="11" fill="#64748b">(Mobile Messenger)</text>
    </g>
  </g>

  <!-- 2. Administrator & Staff -->
  <g transform="translate(1050, 240)">
    <g filter="url(#cardShadow)">
      <rect width="170" height="96" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
      <path d="M 0 6 C 0 2.68 2.68 0 6 0 L 164 0 C 167.32 0 170 2.68 170 6 L 170 28 L 0 28 Z" fill="#2B6CB0"/>
      <text x="85" y="19" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff" letter-spacing="0.5">ADMINISTRATOR</text>
      <text x="85" y="54" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e293b">Admin &amp; Staff</text>
      <text x="85" y="74" text-anchor="middle" font-size="11" fill="#64748b">(Web Dashboard)</text>
    </g>
  </g>

  <!-- 3. Delivery Rider -->
  <g transform="translate(1050, 590)">
    <g filter="url(#cardShadow)">
      <rect width="170" height="96" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
      <path d="M 0 6 C 0 2.68 2.68 0 6 0 L 164 0 C 167.32 0 170 2.68 170 6 L 170 28 L 0 28 Z" fill="#2B6CB0"/>
      <text x="85" y="19" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff" letter-spacing="0.5">DELIVERY RIDER</text>
      <text x="85" y="54" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e293b">Courier Rider</text>
      <text x="85" y="74" text-anchor="middle" font-size="11" fill="#64748b">(Rider Web Portal)</text>
    </g>
  </g>


  <!-- ==================== PROCESSES ==================== -->

  <!-- Process 1.0: AI Chatbot Module -->
  <g transform="translate(340, 110)">
    <g filter="url(#cardShadow)">
      <rect width="260" height="88" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
      <path d="M 0 8 C 0 3.58 3.58 0 8 0 L 252 0 C 256.42 0 260 3.58 260 8 L 260 28 L 0 28 Z" fill="#2B6CB0"/>
      <text x="12" y="19" font-size="12" font-weight="bold" fill="#ffffff">1.0</text>
      <text x="130" y="19" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">AI Chatbot Module</text>
      <text x="130" y="52" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">Communication &amp; NLP</text>
      <text x="130" y="71" text-anchor="middle" font-size="11" fill="#64748b">(Menu Browsing &amp; Inquiries)</text>
    </g>
  </g>

  <!-- Process 2.0: Order Processing Module -->
  <g transform="translate(340, 310)">
    <g filter="url(#cardShadow)">
      <rect width="260" height="88" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
      <path d="M 0 8 C 0 3.58 3.58 0 8 0 L 252 0 C 256.42 0 260 3.58 260 8 L 260 28 L 0 28 Z" fill="#2B6CB0"/>
      <text x="12" y="19" font-size="12" font-weight="bold" fill="#ffffff">2.0</text>
      <text x="130" y="19" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">Order Processing Module</text>
      <text x="130" y="52" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">Transaction Capture</text>
      <text x="130" y="71" text-anchor="middle" font-size="11" fill="#64748b">(Checkout, Fare &amp; Payment)</text>
    </g>
  </g>

  <!-- Process 3.0: Order Management & Inventory Process -->
  <g transform="translate(710, 310)">
    <g filter="url(#cardShadow)">
      <rect width="260" height="88" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
      <path d="M 0 8 C 0 3.58 3.58 0 8 0 L 252 0 C 256.42 0 260 3.58 260 8 L 260 28 L 0 28 Z" fill="#2B6CB0"/>
      <text x="12" y="19" font-size="12" font-weight="bold" fill="#ffffff">3.0</text>
      <text x="130" y="19" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">Order Management Process</text>
      <text x="130" y="52" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">Kitchen &amp; Inventory Control</text>
      <text x="130" y="71" text-anchor="middle" font-size="11" fill="#64748b">(Recipe Deductions &amp; Status)</text>
    </g>
  </g>

  <!-- Process 4.0: Smart Delivery Management Module -->
  <g transform="translate(710, 520)">
    <g filter="url(#cardShadow)">
      <rect width="260" height="88" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
      <path d="M 0 8 C 0 3.58 3.58 0 8 0 L 252 0 C 256.42 0 260 3.58 260 8 L 260 28 L 0 28 Z" fill="#2B6CB0"/>
      <text x="12" y="19" font-size="12" font-weight="bold" fill="#ffffff">4.0</text>
      <text x="130" y="19" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">Smart Delivery Module</text>
      <text x="130" y="52" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">Dispatch &amp; Logistics</text>
      <text x="130" y="71" text-anchor="middle" font-size="11" fill="#64748b">(Scheduling &amp; Rider Tracking)</text>
    </g>
  </g>

  <!-- Process 5.0: Notification & Reporting Process -->
  <g transform="translate(340, 520)">
    <g filter="url(#cardShadow)">
      <rect width="260" height="88" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
      <path d="M 0 8 C 0 3.58 3.58 0 8 0 L 252 0 C 256.42 0 260 3.58 260 8 L 260 28 L 0 28 Z" fill="#2B6CB0"/>
      <text x="12" y="19" font-size="12" font-weight="bold" fill="#ffffff">5.0</text>
      <text x="130" y="19" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">Notification &amp; Reporting</text>
      <text x="130" y="52" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">Alerts &amp; Analytics</text>
      <text x="130" y="71" text-anchor="middle" font-size="11" fill="#64748b">(SSE Broadcast &amp; Reports)</text>
    </g>
