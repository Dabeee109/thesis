  <!-- ==================== DATA STORES ==================== -->

  <!-- D1: Customers -->
  <g transform="translate(60, 480)" filter="url(#cardShadow)">
    <rect width="170" height="42" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <path d="M 0 4 C 0 1.79 1.79 0 4 0 L 36 0 L 36 42 L 4 42 C 1.79 42 0 40.21 0 38 Z" fill="#2B6CB0"/>
    <text x="18" y="26" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">D1</text>
    <text x="103" y="26" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">Customers</text>
  </g>

  <!-- D2: Chatbot Logs -->
  <g transform="translate(60, 110)" filter="url(#cardShadow)">
    <rect width="170" height="42" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <path d="M 0 4 C 0 1.79 1.79 0 4 0 L 36 0 L 36 42 L 4 42 C 1.79 42 0 40.21 0 38 Z" fill="#2B6CB0"/>
    <text x="18" y="26" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">D2</text>
    <text x="103" y="26" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">Chatbot Logs</text>
  </g>

  <!-- D3: Menu Items -->
  <g transform="translate(680, 110)" filter="url(#cardShadow)">
    <rect width="170" height="42" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <path d="M 0 4 C 0 1.79 1.79 0 4 0 L 36 0 L 36 42 L 4 42 C 1.79 42 0 40.21 0 38 Z" fill="#2B6CB0"/>
    <text x="18" y="26" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">D3</text>
    <text x="103" y="26" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">Menu Items</text>
  </g>

  <!-- D4: Inventory & Recipes -->
  <g transform="translate(900, 110)" filter="url(#cardShadow)">
    <rect width="190" height="42" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <path d="M 0 4 C 0 1.79 1.79 0 4 0 L 36 0 L 36 42 L 4 42 C 1.79 42 0 40.21 0 38 Z" fill="#2B6CB0"/>
    <text x="18" y="26" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">D4</text>
    <text x="113" y="26" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">Inventory &amp; Recipes</text>
